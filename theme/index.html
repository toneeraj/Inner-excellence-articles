<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:type" content="article">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
__CSS__

<script>document.documentElement.classList.add("js");</script>

<body>

<div class="shell" data-collection>
  <aside class="rail">
    <a class="wordmark" href="./">Inner excellence</a>

    <form class="finder js-only" role="search" onsubmit="return false">
      <label class="sr-only" for="q">Search articles</label>
      <input id="q" type="search" placeholder="Search" autocomplete="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <kbd aria-hidden="true">/</kbd>
    </form>

    <nav class="facets js-only" aria-label="Filter by pillar">
      <span class="rail-label" id="facet-label">Pillars</span>
      <ul aria-labelledby="facet-label">
__FILTERS__
      </ul>
    </nav>

    <p class="tally js-only" id="tally" aria-live="polite">__COUNT__</p>
  </aside>

  <main class="stream">
    <header>
      <div class="meta">
        <span class="pillar">Collected</span>
        <span>__COUNT__</span>
      </div>
      <h1>__TITLE__</h1>
      <p class="standfirst">__STANDFIRST__</p>
    </header>

    <ul class="entries">
__ENTRIES__
    </ul>

    <p class="empty" id="empty" hidden>
      Nothing here matches that. <button type="button" id="clear">Clear the filters</button>
    </p>

    <footer>
      <span class="src-label">About</span>
      <span>Each piece takes a passage from a teacher and works it against a</span>
      <span>stretch of an ordinary day. The passage is the fixed part.</span>
    </footer>
  </main>
</div>

<script>
__JS__
</script>
</body>
</html>
