name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # render.py is stdlib only — nothing to install
      - name: Render posts and index
        run: python3 render.py

      - name: Fail if the build is empty
        run: test -f build/index.html

      # enablement turns Pages on for the repo if it isn't already
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
